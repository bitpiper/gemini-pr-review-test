name: Test Gemini Secret

on:
  workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "❌ GEMINI_API_KEY is not set"
            exit 1
          else
            echo "✅ GEMINI_API_KEY is set (length: $(echo -n '${{ secrets.GEMINI_API_KEY }}' | wc -c))"
          fi
      
      - name: Test API call
        run: |
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"contents":[{"parts":[{"text":"test"}]}]}' \
            | head -c 500
