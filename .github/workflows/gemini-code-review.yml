name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "dbt/**"
      - "bronze/**"
      - "**/*.sql"
      - "**/*.py"

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gemini-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-branch
          git diff origin/${{ github.base_ref }}...pr-branch > /tmp/pr.diff

      - name: Review with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 << 'PYTHON_EOF'
          import json
          import urllib.request
          import os
          import urllib.error

          api_key = os.environ.get('GEMINI_API_KEY', '').strip()
          
          if not api_key:
              with open('/tmp/response.json', 'w') as f:
                  json.dump({"error": "API key not configured"}, f)
              exit(0)

          with open('/tmp/pr.diff') as f:
              diff = f.read()[:2000]

          models = ["gemini-2.0-flash", "gemini-1.5-flash", "gemini-1.5-pro"]
          result = None

          for model in models:
              try:
                  payload = json.dumps({
                      "contents": [{
                          "parts": [{
                              "text": f"Code review:\n{diff}"
                          }]
                      }]
                  }).encode('utf-8')

                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={api_key}"
                  req = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"})
                  with urllib.request.urlopen(req) as response:
                      result = json.loads(response.read())
                      break
              except: pass

          if result:
              with open('/tmp/response.json', 'w') as f:
                  json.dump(result, f)
          else:
              with open('/tmp/response.json', 'w') as f:
                  json.dump({"error": "API unavailable"}, f)
          PYTHON_EOF

      - name: Post comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const resp = JSON.parse(fs.readFileSync('/tmp/response.json', 'utf8'));

            let body = '## 🤖 Gemini Code Review\n\n';
            if (resp.candidates?.[0]?.content?.parts?.[0]?.text) {
              body += resp.candidates[0].content.parts[0].text;
            } else if (resp.error) {
              body += `**Error:** ${resp.error}`;
            } else {
              body += 'No review generated';
            }
            body += '\n\n_Automated review_';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
