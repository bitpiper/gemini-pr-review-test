name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "dbt/**"
      - "bronze/**"
      - "**/*.sql"
      - "**/*.py"

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gemini-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-branch
          git diff origin/${{ github.base_ref }}...pr-branch > /tmp/pr.diff

      - name: Review with Gemini
        run: |
          python3 << 'EOF'
          import json
          import urllib.request
          import os

          api_key = os.environ.get('GEMINI_API_KEY')
          with open('/tmp/pr.diff') as f:
              diff = f.read()[:3000]

          # Try gemini-2.0-flash first, fallback to gemini-1.5-flash
          models = ["gemini-2.0-flash", "gemini-1.5-flash"]
          result = None

          for model in models:
              payload = json.dumps({
                  "contents": [{
                      "parts": [{
                          "text": f"Review this code diff for issues:\n\nDiff:\n{diff}"
                      }]
                  }]
              }).encode()

              url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={api_key}"
              req = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"})

              try:
                  with urllib.request.urlopen(req) as response:
                      result = json.loads(response.read())
                      print(f"✅ Got response from {model}")
                      break
              except Exception as e:
                  print(f"⚠️  {model} failed: {e}")
                  continue

          if result:
              with open('/tmp/response.json', 'w') as f:
                  json.dump(result, f)
          else:
              with open('/tmp/response.json', 'w') as f:
                  json.dump({"error": "All models failed"}, f)
          EOF

      - name: Post comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const resp = JSON.parse(fs.readFileSync('/tmp/response.json', 'utf8'));

            // Extract review text from Gemini response
            let reviewText = 'No review generated';
            if (resp.candidates && resp.candidates[0]?.content?.parts?.[0]?.text) {
              reviewText = resp.candidates[0].content.parts[0].text;
            } else if (resp.error) {
              reviewText = `API Error: ${resp.error.message || JSON.stringify(resp.error)}`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Gemini Code Review\n\n${reviewText}\n\n_Automated review_`
            });
            console.log('✅ Posted');
