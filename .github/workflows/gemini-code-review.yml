name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Skip docs/config-only PRs — only review code/models
    paths:
      - "dbt/**"
      - "bronze/**"
      - "**/*.sql"
      - "**/*.py"

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gemini-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python dependencies
        run: |
          pip install -q google-generativeai requests

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-branch
          git diff origin/${{ github.base_ref }}...pr-branch > /tmp/pr.diff
          echo "diff_size=$(wc -c < /tmp/pr.diff)" >> $GITHUB_OUTPUT

      - name: Run Gemini Code Review
        id: review
        if: steps.diff.outputs.diff_size < 500000  # Skip huge diffs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYTHON_EOF'
          import os
          import json
          from pathlib import Path

          import google.generativeai as genai

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              print("ERROR: GEMINI_API_KEY not set")
              exit(1)

          genai.configure(api_key=api_key)
          model = genai.GenerativeModel("gemini-2.0-flash")

          # Read the diff
          diff_file = Path("/tmp/pr.diff")
          if not diff_file.exists():
              print("No diff file found")
              exit(0)

          diff_content = diff_file.read_text()
          if not diff_content.strip():
              print("Empty diff")
              exit(0)

          # Request review from Gemini
          prompt = f"""You are an expert code reviewer. Review the following code changes and identify:
          1. Security issues (hardcoded credentials, injection vulnerabilities, etc.)
          2. Logic errors or bugs
          3. Performance issues
          4. Code quality problems

          For dbt models, also check:
          - Correct naming (silver = sil_*, gold = gol_*)
          - Proper materialization (silver=views, gold=tables)
          - Tests on gold model keys
          - No SELECT * in silver/gold

          Format your response as a JSON object with findings array, each with:
          - file: the filename
          - line: line number if identifiable
          - severity: "critical", "high", "medium", or "low"
          - title: short title
          - description: explanation

          If no issues found, return empty findings array.

          Here's the diff:

          ```diff
          {diff_content[:10000]}
          ```
          """

          response = model.generate_content(prompt)

          # Parse response
          try:
              result_text = response.text
              # Extract JSON if it's wrapped in markdown code blocks
              if "```json" in result_text:
                  result_text = result_text.split("```json")[1].split("```")[0]
              elif "```" in result_text:
                  result_text = result_text.split("```")[1].split("```")[0]

              findings = json.loads(result_text)
              print(json.dumps(findings, indent=2))

          except (json.JSONDecodeError, AttributeError, IndexError) as e:
              print(f"Error parsing Gemini response: {e}")
              print(f"Raw response: {response.text if response else 'No response'}")
              exit(1)

          PYTHON_EOF

      - name: Post review comments
        if: steps.review.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = `${{ steps.review.outputs.review }}`;

            if (!output || output === 'null' || !output.includes('findings')) {
              console.log('No findings from Gemini');
              return;
            }

            try {
              const findings = JSON.parse(output);

              if (!findings.findings || findings.findings.length === 0) {
                core.info('No issues found');
                return;
              }

              // Post summary comment
              const summary = findings.findings
                .map(f => `- [${f.severity.toUpperCase()}] ${f.file}:${f.line || '?'} - ${f.title}`)
                .join('\n');

              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## Gemini Code Review\n\n${summary}\n\n<sub>Review by Gemini 2.0</sub>`
              });

            } catch (e) {
              console.error('Error parsing findings:', e);
            }
