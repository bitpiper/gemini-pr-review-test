name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "dbt/**"
      - "bronze/**"
      - "**/*.sql"
      - "**/*.py"

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gemini-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-branch
          git diff origin/${{ github.base_ref }}...pr-branch > /tmp/pr.diff

      - name: Review with Gemini
        run: |
          python3 << 'EOF'
          import json
          import urllib.request
          import os

          api_key = os.environ.get('GEMINI_API_KEY')
          with open('/tmp/pr.diff') as f:
              diff = f.read()[:3000]

          payload = json.dumps({
              "contents": [{
                  "parts": [{
                      "text": f"Review this code diff. Return ONLY JSON with array of issues:\n{json.dumps({'issues': [{'severity': 'high/medium/low', 'title': '...', 'description': '...'}]})}\n\nEmpty array if no issues.\n\nDiff:\n{diff}"
                  }]
              }]
          }).encode()

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key={api_key}"
          req = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"})

          try:
              with urllib.request.urlopen(req) as response:
                  result = json.loads(response.read())
                  with open('/tmp/response.json', 'w') as f:
                      json.dump(result, f)
                  print("✅ Gemini API call succeeded")
          except Exception as e:
              print(f"❌ Gemini API error: {e}")
              with open('/tmp/response.json', 'w') as f:
                  json.dump({"error": str(e)}, f)
          EOF

      - name: Post comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const resp = JSON.parse(fs.readFileSync('/tmp/response.json', 'utf8'));
            const text = resp.candidates?.[0]?.content?.parts?.[0]?.text || JSON.stringify(resp);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Gemini Code Review\n\n\`\`\`json\n${text}\n\`\`\`\n\n_Automated review_`
            });
            console.log('✅ Posted');
