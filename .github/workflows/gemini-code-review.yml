name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "dbt/**"
      - "bronze/**"
      - "**/*.sql"
      - "**/*.py"

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gemini-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-branch
          git diff origin/${{ github.base_ref }}...pr-branch > /tmp/pr.diff

      - name: Review with Gemini
        run: |
          DIFF=$(head -c 3000 /tmp/pr.diff)
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -H "Content-Type: application/json" \
            --data-raw "{\"contents\":[{\"parts\":[{\"text\":\"Review this code diff and return ONLY JSON:\n{\\\"issues\\\":[{\\\"severity\\\":\\\"high/medium/low\\\",\\\"title\\\":\\\"...\\\",\\\"description\\\":\\\"...\\\"}]}\n\nIf no issues, return empty array.\n\nDiff:\n$DIFF\"}]}]}" \
            > /tmp/response.json
          echo "=== Gemini Response ==="
          cat /tmp/response.json

      - name: Post comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const resp = JSON.parse(fs.readFileSync('/tmp/response.json', 'utf8'));
              const text = resp.candidates?.[0]?.content?.parts?.[0]?.text || 'No text';
              console.log('Posting comment with text:', text.substring(0, 100));
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 🤖 Gemini Code Review\n\n\`\`\`json\n${text}\n\`\`\`\n\n_Automated_`
              });
              console.log('✅ Comment posted');
            } catch (e) {
              console.error('Error:', e.message);
            }
