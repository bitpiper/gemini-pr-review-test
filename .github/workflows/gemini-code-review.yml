name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "dbt/**"
      - "bronze/**"
      - "**/*.sql"
      - "**/*.py"

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gemini-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-branch
          git diff origin/${{ github.base_ref }}...pr-branch > /tmp/pr.diff
          echo "Diff size: $(wc -c < /tmp/pr.diff) bytes"

      - name: Test Gemini API
        run: |
          # Simple test to validate API key and get actual error response
          python3 << 'EOF'
          import json
          import urllib.request
          import os
          import urllib.error

          api_key = os.environ.get('GEMINI_API_KEY', '').strip()
          
          if not api_key:
              print("❌ ERROR: GEMINI_API_KEY not set!")
              exit(1)
          
          print(f"✅ API Key is set (length: {len(api_key)})")

          # Read diff
          with open('/tmp/pr.diff') as f:
              diff = f.read()[:1000]

          payload = json.dumps({
              "contents": [{
                  "parts": [{
                      "text": f"Review:\n{diff}"
                  }]
              }]
          }).encode('utf-8')

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}"
          req = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"})

          try:
              with urllib.request.urlopen(req) as response:
                  result = json.loads(response.read())
                  print("✅ API call successful!")
                  with open('/tmp/response.json', 'w') as f:
                      json.dump(result, f)
          except urllib.error.HTTPError as e:
              body = e.read().decode('utf-8', errors='ignore')
              print(f"❌ HTTP {e.code}")
              print(f"Response: {body}")
              with open('/tmp/response.json', 'w') as f:
                  json.dump({"error": body}, f)
          except Exception as e:
              print(f"❌ Error: {e}")
              with open('/tmp/response.json', 'w') as f:
                  json.dump({"error": str(e)}, f)
          EOF

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const resp = JSON.parse(fs.readFileSync('/tmp/response.json', 'utf8'));
            
            let body = '## 🤖 Gemini Code Review - Diagnostic\n\n';
            if (resp.error) {
              body += '**API Error:**\n```\n' + JSON.stringify(resp.error, null, 2).substring(0, 1000) + '\n```';
            } else if (resp.candidates) {
              body += '**✅ API Working** - Review available';
            } else {
              body += '**Unknown Response:**\n```\n' + JSON.stringify(resp, null, 2).substring(0, 500) + '\n```';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
